        const replaceIds = {
            fhirEndpoint: (o) => o.messaging[0].endpoint[0].address,
            fhirVersion: (o) => o.fhirVersion,
        }
        async function getCapabilityStatement() {
            try {
                const capabilityStatement = await fetch("CapabilityStatement?_format=application/json");
                return await capabilityStatement.json();
            }
            catch (e) {
                console.error(e);
            }
        }

        async function fetchStructureDefinition() {
            try {
                var resourceList = document.getElementById("resourceList");
                const structureDefinition = await fetch(`StructureDefinition/${resourceList.value}?_format=application/json`);
                var json = await structureDefinition.json();
                document.getElementById("scoped-container").innerHTML = `<pre class='language-structure-definition'>${JSON.stringify(json, null, 2)}</pre>`;
                G({ startOnLoad: false, mode: 'hybrid' });
               
            }
            catch (e) {
                console.error(e);
            }
        }

        async function initialize() {
            const capabilityStatement = await getCapabilityStatement();

            Object.keys(replaceIds).forEach(k => {
                try {
                    var value = replaceIds[k](capabilityStatement);
                    document.getElementById(k).innerText = value;
                    console.info(`${k}=${value}`);
                }
                catch (e) {
                    console.warn(e);
                }
            });

            var resourceList = document.getElementById("resourceList");
            capabilityStatement.rest[0].resource.forEach(res => {
                try {
                    var optionNode = document.createElement("option");
                    optionNode.setAttribute("value", res.type);
                    optionNode.innerText = res.type;
                    resourceList.appendChild(optionNode);
                }
                catch (e) {
                    console.warn(e);
                }
            });
            console.info(capabilityStatement);
        }
        initialize();
    </script>
